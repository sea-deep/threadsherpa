    <!-- Front utility pouch -->
    <rect x="115" y="152" width="50" height="32" rx="12" fill="#D7F59C"/>
    <!-- Fastener buckle -->
    <rect x="131" y="146" width="20" height="10" rx="3" fill="#6D8245"/>
    <!-- Shoulder harness strap left -->
    <path d="M85 75C68 75 56 94 56 122v42c0 14 8 24 20 28" stroke="#6D8245" stroke-width="9" stroke-linecap="round"/>
  </g>
