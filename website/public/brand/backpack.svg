<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" role="img" aria-label="ThreadSherpa Trail Pack">
  <title>ThreadSherpa Trail Pack</title>
  <g transform="translate(-15, -15)">
    <!-- Backpack shadow -->
    <ellipse cx="115" cy="188" rx="42" ry="7" fill="#09090D" opacity="0.35"/>
    <!-- Main pack body -->
    <path d="M85 58h52c30 0 50 22 50 50v62c0 20-18 36-44 36H85z" fill="#A8BF79"/>
