# Render Blueprint Specification for ThreadSherpa
# Category: Best Use of Render ($200)

services:
  - type: worker
    name: threadsherpa-copilot
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PROVIDER
        value: mongodb
      - key: MONGODB_URI
        sync: false # Set via Render Dashboard with your MongoDB Atlas connection string
      - key: MONGODB_DB_NAME
        value: threadsherpa
      - key: DISCORD_BOT_TOKEN
        sync: false # Set via Render Dashboard
      - key: DISCORD_CLIENT_ID
        sync: false # Set via Render Dashboard
      - key: SENTRY_DSN
        sync: false # Optional Sentry Agent Tracing DSN
      - key: SERPAPI_API_KEY
        sync: false # Optional SerpApi Google search key
      - key: MODEL_PROVIDER
        value: gemini # 'gemini' | 'openai' | 'groq' | 'openrouter' | 'ollama'
      - key: GEMINI_API_KEY
        sync: false # Set via Render Dashboard when using Google Gemini cloud inference
      - key: OPENAI_API_KEY
        sync: false # Set via Render Dashboard when using OpenAI / OpenRouter
      - key: GROQ_API_KEY
        sync: false # Set via Render Dashboard when using Groq
      - key: OPENAI_MODEL
        value: gemini-2.0-flash # Or 'gpt-4o-mini', 'llama-3.3-70b-versatile'
      - key: OLLAMA_BASE_URL
        value: http://localhost:11434
      - key: OLLAMA_MODEL
        value: gemma4:e4b-it-qat
      - key: OLLAMA_EMBEDDING_MODEL
        value: embeddinggemma-2:270m
