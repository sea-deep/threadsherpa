# Public website only. The Discord bot runs separately.
services:
  - type: web
    name: threadsherpa
    runtime: static
    buildCommand: npm ci --prefix website && npm run build --prefix website
    staticPublishPath: website/dist
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: SKIP_INSTALL_DEPS
        value: "true"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
