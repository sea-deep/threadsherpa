services:
  threadsherpa:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: threadsherpa
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_PROVIDER=mongodb
      - MONGODB_URI=mongodb://mongodb:27017/threadsherpa
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    depends_on:
      - mongodb
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mongodb:
    image: mongo:7-jammy
    container_name: threadsherpa_mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
    driver: local
